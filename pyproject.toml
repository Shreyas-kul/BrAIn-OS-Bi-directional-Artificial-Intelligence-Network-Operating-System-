[project]
name = "brain-os"
version = "0.1.0"
description = "BrAIn OS — Bi-directional Artificial Intelligence Network Operating System. An OS-inspired Agent Kernel that treats LLM agents as first-class processes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]

dependencies = [
    # --- Core Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # --- Agent Orchestration ---
    "langgraph>=0.4.0",
    "langgraph-checkpoint-redis>=0.1.0",

    # --- LLM Interface (unified — supports Ollama, Groq, OpenAI, Gemini, Claude) ---
    "litellm>=1.60.0",

    # --- Memory & Vector Store ---
    "redis[hiredis]>=5.2.0",
    "chromadb>=0.6.0",

    # --- Embeddings & Reranking ---
    "sentence-transformers>=3.4.0",

    # --- Security & Guardrails ---
    "pydantic>=2.10.0",

    # --- Observability ---
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",

    # --- Config ---
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",

    # --- Utilities ---
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]

[project.scripts]
brain-os = "brain_os.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
